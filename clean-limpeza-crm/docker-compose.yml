services:
  crm:
    build: .
    image: clean-limpeza-crm
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Opcional: se não definir, uma chave segura é gerada e salva em /app/data.
      JWT_SECRET: ${JWT_SECRET:-}
    volumes:
      - crm-data:/app/data

volumes:
  crm-data:
